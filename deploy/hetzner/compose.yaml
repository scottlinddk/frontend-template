services:
  web:
    build:
      context: ../..
      dockerfile: deploy/hetzner/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-none}
        VITE_MSAL_CLIENT_ID: ${VITE_MSAL_CLIENT_ID:-} # @adapter msal
        VITE_MSAL_AUTHORITY: ${VITE_MSAL_AUTHORITY:-} # @adapter msal
        VITE_MSAL_SCOPES: ${VITE_MSAL_SCOPES:-} # @adapter msal
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-} # @adapter clerk
    restart: unless-stopped
    ports:
      - "8080:8080"
