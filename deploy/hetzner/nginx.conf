server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  # Add a Content-Security-Policy per project. Entra ID and Clerk each need
  # their own connect-src/frame-src entries, so none is shipped by default.

  # Hashed build output never changes, so cache it for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html must always be revalidated so deploys take effect.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # SPA fallback.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
