<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Template</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Keep the key
      // in sync with src/shared/theme/ThemeProvider.tsx.
      try {
        var theme = localStorage.getItem("frontend-template.theme");
        var dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
